<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>VAS Pain Scale (Drift Corrected)</title>

<style>

body{
    margin:0;
    overflow:hidden;
    cursor:none;
    font-family:sans-serif;
    background:white;
}

#vas-container{
    position:absolute;
    left:10%;
    right:10%;
    top:50%;
    height:120px;
}

#vas-line{
    position:absolute;
    width:100%;
    height:4px;
    background:#aaa;
    top:40px;
}

#vas-marker{
    position:absolute;
    width:24px;
    height:24px;
    background:red;
    border-radius:50%;
    top:32px;
    transform:translate(-50%,-50%);
    left:0px;
}

.label{
    position:absolute;
    top:65px;
    font-size:18px;
    font-weight:600;
    color:#333;
}

#left-label{ left:0; }
#right-label{ right:0; text-align:right; }

</style>
</head>

<body>

<div id="vas-container">
    <div id="vas-line"></div>
    <div id="vas-marker"></div>

    <div id="left-label" class="label">Ingen smerte</div>
    <div id="right-label" class="label">Ekstrem smerte</div>
</div>

<script>

//==================================================
// DIAGNOSTIC TIMING
//==================================================

// Absolute browser timestamp as soon as this script starts
const scriptLoadPerformance = performance.now();

// These will be filled in as events occur
let windowLoadPerformance = null;
let recordingStartPerformance = null;
let firstSamplePerformance = null;
let recordingEndPerformance = null;

//==================================================
// SETTINGS
//==================================================

const PROGRAM_NAME = "T45";
const RECORDING_DURATION = 389120; // ms
const SAMPLE_INTERVAL = 50;

//==================================================

const container = document.getElementById("vas-container");
const marker = document.getElementById("vas-marker");

// state
let started = false;
let finished = false;

let startTime = 0;

let currentX = 0;
let currentVAS = 0;

// data
let data = [];
let events = [];

// sample index (NOT time-based loop)
let sampleIndex = 0;

//==================================================
// Diagnostic: JavaScript started
//==================================================

events.push({
    time: 0,
    absoluteTime: scriptLoadPerformance,
    event: "Page Script Loaded"
});

//==================================================
// Mouse tracking (only updates state)
//==================================================

document.addEventListener("mousemove", (e) => {

    if (!started || finished) return;

    const rect = container.getBoundingClientRect();

    let x = e.clientX - rect.left;
    x = Math.max(0, Math.min(rect.width, x));

    currentX = x;

    marker.style.left = currentX + "px";

    currentVAS = Math.round((currentX / rect.width) * 100);
});

//==================================================
// START
//==================================================

function startVAS(){

    if(started) return;

    started = true;

    recordingStartPerformance = performance.now();
    startTime = recordingStartPerformance;

    events.push({
        time: 0,
        absoluteTime: recordingStartPerformance,
        event: "Recording Started"
    });

    sampleIndex = 0;

    sampleLoop();

}

//==================================================
// DRIFT-CORRECTED SAMPLING LOOP
//==================================================

function sampleLoop(){

    if(finished) return;

    const now = performance.now();
    const elapsed = now - startTime;

    const expectedTime = sampleIndex * SAMPLE_INTERVAL;

    // only record when we reach the expected time
    if (elapsed >= expectedTime) {

        sampleIndex++;

        // Diagnostic: record when the first sample actually occurs
        if (firstSamplePerformance === null) {

            firstSamplePerformance = now;

            events.push({
                time: Math.round(elapsed),
                absoluteTime: firstSamplePerformance,
                event: "First Sample"
            });
        }

        data.push({
            sample: sampleIndex,
            time: expectedTime,
            vas: currentVAS
        });
    }

    // stop condition (based on true duration)
    if (elapsed >= RECORDING_DURATION) {

        stopVAS();
        return;
    }

    requestAnimationFrame(sampleLoop);

}

//==================================================
// STOP
//==================================================

function stopVAS(){

    if(finished) return;

    finished = true;

    recordingEndPerformance = performance.now();

    const endTime = recordingEndPerformance - startTime;

    events.push({
        time: Math.round(endTime),
        absoluteTime: recordingEndPerformance,
        event: "Recording Finished"
    });

    downloadCSV();

    setTimeout(() => {
        document.body.innerHTML =
        "<h1 style='text-align:center;font-family:sans-serif;'>Finished</h1>";
    }, 3000);

}

//==================================================
// CSV EXPORT
//==================================================

function downloadCSV(){

    const now = new Date();

    const expectedSamples = Math.floor(RECORDING_DURATION / SAMPLE_INTERVAL);
    const actualSamples = data.length;

    let filename =
        "OA_" +
        PROGRAM_NAME +
        "_" +
        now.toISOString().replace(/:/g,"-") +
        ".csv";

    let csv = "";

    //==================================================
    // METADATA
    //==================================================

    csv += "Experiment,Offset Analgesia\n";
    csv += "Program," + PROGRAM_NAME + "\n";
    csv += "Duration_ms," + RECORDING_DURATION + "\n";
    csv += "SamplingInterval_ms," + SAMPLE_INTERVAL + "\n";
    csv += "ExpectedSamples," + expectedSamples + "\n";
    csv += "ActualSamples," + actualSamples + "\n";
    csv += "StartTime," + now.toISOString() + "\n";

    //==================================================
    // DIAGNOSTIC TIMING
    //==================================================

    csv += "\nDIAGNOSTIC TIMING\n";

    csv += "Metric,Value_ms\n";

    if (windowLoadPerformance !== null) {
        csv += "Script_Load_to_Window_Load," +
               (windowLoadPerformance - scriptLoadPerformance).toFixed(3) +
               "\n";
    }

    if (recordingStartPerformance !== null) {
        csv += "Script_Load_to_Recording_Start," +
               (recordingStartPerformance - scriptLoadPerformance).toFixed(3) +
               "\n";
    }

    if (windowLoadPerformance !== null &&
        recordingStartPerformance !== null) {

        csv += "Window_Load_to_Recording_Start," +
               (recordingStartPerformance - windowLoadPerformance).toFixed(3) +
               "\n";
    }

    if (firstSamplePerformance !== null &&
        recordingStartPerformance !== null) {

        csv += "Recording_Start_to_First_Sample," +
               (firstSamplePerformance - recordingStartPerformance).toFixed(3) +
               "\n";
    }

    if (recordingEndPerformance !== null &&
        recordingStartPerformance !== null) {

        csv += "Recording_Duration_Actual," +
               (recordingEndPerformance - recordingStartPerformance).toFixed(3) +
               "\n";
    }

    //==================================================
    // EVENTS
    //==================================================

    csv += "\nEVENTS\n";
    csv += "Time_ms,AbsolutePerformance_ms,Event\n";

    events.forEach(e => {
        csv += e.time + "," +
               e.absoluteTime.toFixed(3) + "," +
               e.event + "\n";
    });

    //==================================================
    // DATA
    //==================================================

    csv += "\nDATA\n";
    csv += "Sample,TrialTime_ms,VAS\n";

    data.forEach(d => {
        csv += `${d.sample},${d.time},${d.vas}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;

    document.body.appendChild(a);

    setTimeout(() => {
        a.click();
    }, 100);

    setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 3000);

}

//==================================================
// AUTO START (iMotions trigger timing)
//==================================================

window.addEventListener("load", () => {

    // Record exactly when the browser's load event occurs
    windowLoadPerformance = performance.now();

    events.push({
        time: Math.round(windowLoadPerformance - scriptLoadPerformance),
        absoluteTime: windowLoadPerformance,
        event: "Window Load"
    });

    startVAS();

});

</script>

</body>
</html>
